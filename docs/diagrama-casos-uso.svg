<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <rect width="1000" height="750" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="500" y="35" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="18" font-weight="bold">DIAGRAMA DE CASOS DE USO — FARMABOL</text>
  <text x="500" y="55" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="12">Sistema de Gestión de Inventario y Ventas Multi-sucursal</text>

  <!-- BOUNDING BOX: Sistema -->
  <rect x="280" y="80" width="680" height="640" fill="none" stroke="#000000" stroke-width="1.5" />
  <rect x="280" y="80" width="120" height="24" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="340" y="97" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">FARMABOL</text>

  <!-- ACTORS -->
  <!-- Admin (left) -->
  <g transform="translate(70, 200)">
    <line x1="50" y1="65" x2="50" y2="130" stroke="#000000" stroke-width="1" />
    <line x1="25" y1="95" x2="75" y2="95" stroke="#000000" stroke-width="1" />
    <line x1="25" y1="80" x2="75" y2="80" stroke="#000000" stroke-width="1" />
    <circle cx="50" cy="25" r="25" fill="none" stroke="#000000" stroke-width="1.5" />
    <ellipse cx="50" cy="80" rx="30" ry="20" fill="none" stroke="#000000" stroke-width="1.5" />
    <line x1="10" y1="130" x2="90" y2="130" stroke="#000000" stroke-width="1" />
    <line x1="50" y1="130" x2="50" y2="145" stroke="#000000" stroke-width="1" />
    <line x1="50" y1="145" x2="30" y2="165" stroke="#000000" stroke-width="1" />
    <line x1="50" y1="145" x2="70" y2="165" stroke="#000000" stroke-width="1" />
    <text x="50" y="190" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold">Administrador</text>
  </g>

  <!-- Vendedor (left bottom) -->
  <g transform="translate(70, 470)">
    <line x1="50" y1="65" x2="50" y2="130" stroke="#000000" stroke-width="1" />
    <line x1="25" y1="95" x2="75" y2="95" stroke="#000000" stroke-width="1" />
    <line x1="25" y1="80" x2="75" y2="80" stroke="#000000" stroke-width="1" />
    <circle cx="50" cy="25" r="25" fill="none" stroke="#000000" stroke-width="1.5" />
    <ellipse cx="50" cy="80" rx="30" ry="20" fill="none" stroke="#000000" stroke-width="1.5" />
    <line x1="10" y1="130" x2="90" y2="130" stroke="#000000" stroke-width="1" />
    <line x1="50" y1="130" x2="50" y2="145" stroke="#000000" stroke-width="1" />
    <line x1="50" y1="145" x2="30" y2="165" stroke="#000000" stroke-width="1" />
    <line x1="50" y1="145" x2="70" y2="165" stroke="#000000" stroke-width="1" />
    <text x="50" y="190" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold">Vendedor</text>
  </g>

  <!-- CASES OF USE -->

  <!-- Case: Iniciar Sesión -->
  <ellipse cx="440" cy="140" rx="110" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="440" y="145" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">Iniciar Sesión</text>

  <!-- Case: Gestionar Productos -->
  <ellipse cx="440" cy="230" rx="125" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="440" y="235" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">Gestionar Productos</text>

  <!-- Case: Realizar Venta -->
  <ellipse cx="440" cy="340" rx="110" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="440" y="345" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">Realizar Venta</text>

  <!-- Case: Ver Dashboard -->
  <ellipse cx="440" cy="440" rx="105" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="440" y="445" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">Ver Dashboard</text>

  <!-- Case: Transferir Stock -->
  <ellipse cx="660" cy="250" rx="120" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="660" y="255" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">Transferir Stock</text>

  <!-- Case: Subir Comprobante -->
  <ellipse cx="660" cy="360" rx="130" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="660" y="365" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">Subir Comprobante</text>

  <!-- Case: Consultar State -->
  <ellipse cx="660" cy="460" rx="120" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="660" y="465" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">Consultar State</text>

  <!-- INCLUDES - Iniciar Sesión includes Verification -->
  <ellipse cx="440" cy="560" rx="140" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="440" y="565" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">«include» Verificar Rol</text>

  <!-- Association lines from Admin -->
  <line x1="190" y1="240" x2="330" y2="140" stroke="#000000" stroke-width="1" />
  <line x1="190" y1="240" x2="315" y2="230" stroke="#000000" stroke-width="1" />
  <line x1="190" y1="240" x2="330" y2="340" stroke="#000000" stroke-width="1" />
  <line x1="190" y1="240" x2="335" y2="440" stroke="#000000" stroke-width="1" />
  <line x1="190" y1="240" x2="540" y2="250" stroke="#000000" stroke-width="1" />
  <line x1="190" y1="240" x2="530" y2="360" stroke="#000000" stroke-width="1" />
  <line x1="190" y1="240" x2="540" y2="460" stroke="#000000" stroke-width="1" />

  <!-- Association lines from Vendedor -->
  <line x1="170" y1="540" x2="330" y2="340" stroke="#000000" stroke-width="1" />
  <line x1="170" y1="540" x2="335" y2="440" stroke="#000000" stroke-width="1" />
  <line x1="170" y1="540" x2="330" y2="140" stroke="#000000" stroke-width="1" />

  <!-- <<include>> arrow from Iniciar Sesión to Verificar Rol -->
  <line x1="440" y1="165" x2="440" y2="535" stroke="#000000" stroke-width="0.5" stroke-dasharray="6 3" />
  <polygon points="437,532 443,535 437,538" fill="#000000" />

  <!-- EXTENDS: Ver Dashboard extends Ver Reportes -->
  <ellipse cx="660" cy="570" rx="125" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="660" y="575" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11">«extend» Ver Reportes</text>
  <line x1="545" y1="445" x2="535" y2="570" stroke="#000000" stroke-width="0.5" stroke-dasharray="6 3" />
  <polygon points="538,567 532,570 538,573" fill="#000000" />
</svg>