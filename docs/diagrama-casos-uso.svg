<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000"/>
    </marker>
    <marker id="open" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#000" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">DIAGRAMA DE CASOS DE USO (UML)</text>
  <text x="400" y="44" text-anchor="middle" font-family="Arial" font-size="10">Definición de Roles, Actores y Fronteras del Sistema FARMABOL</text>

  <!-- System Boundary -->
  <rect x="160" y="56" width="490" height="558" rx="6" fill="none" stroke="#000" stroke-width="2"/>
  <text x="405" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">SISTEMA POS — FARMABOL</text>

  <!-- Use Cases (ovals) -->
  <!-- UC1: Iniciar Sesión -->
  <ellipse cx="405" cy="125" rx="120" ry="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="129" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Iniciar Sesión (Login)</text>

  <!-- UC2: Consultar Catálogo/Stock -->
  <ellipse cx="405" cy="205" rx="120" ry="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="209" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Consultar Catálogo/Stock</text>

  <!-- UC3: Registrar Venta -->
  <ellipse cx="405" cy="285" rx="120" ry="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="289" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Registrar Transacción de Venta</text>

  <!-- UC4: Gestionar Inventario -->
  <ellipse cx="405" cy="365" rx="120" ry="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="369" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Gestionar Inventario / Catálogo</text>

  <!-- UC5: Generar Reporte Diario -->
  <ellipse cx="405" cy="445" rx="120" ry="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="449" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Generar Reporte Diario (Caja)</text>

  <!-- UC6: Generar Reporte Mensual -->
  <ellipse cx="405" cy="520" rx="120" ry="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="524" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Generar Reporte Mensual</text>

  <!-- UC7: Consultar Auditoría -->
  <ellipse cx="405" cy="590" rx="120" ry="26" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="405" y="594" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Consultar Auditoría / Estado</text>

  <!-- ACTOR LEFT: Vendedor -->
  <!-- Head -->
  <circle cx="65" cy="165" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <!-- Body -->
  <line x1="65" y1="185" x2="65" y2="230" stroke="#000" stroke-width="1.5"/>
  <!-- Arms -->
  <line x1="35" y1="205" x2="95" y2="205" stroke="#000" stroke-width="1.5"/>
  <!-- Legs -->
  <line x1="65" y1="230" x2="42" y2="260" stroke="#000" stroke-width="1.5"/>
  <line x1="65" y1="230" x2="88" y2="260" stroke="#000" stroke-width="1.5"/>
  <text x="65" y="278" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Vendedor</text>
  <text x="65" y="293" text-anchor="middle" font-family="Arial" font-size="9">(Personal de Ventas)</text>

  <!-- ACTOR RIGHT: Administrador -->
  <circle cx="735" cy="165" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="735" y1="185" x2="735" y2="230" stroke="#000" stroke-width="1.5"/>
  <line x1="705" y1="205" x2="765" y2="205" stroke="#000" stroke-width="1.5"/>
  <line x1="735" y1="230" x2="712" y2="260" stroke="#000" stroke-width="1.5"/>
  <line x1="735" y1="230" x2="758" y2="260" stroke="#000" stroke-width="1.5"/>
  <text x="735" y="278" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Administrador</text>
  <text x="735" y="293" text-anchor="middle" font-family="Arial" font-size="9">(Gerencia / Sistemas)</text>

  <!-- Lines: Vendedor → UCs (left side) -->
  <line x1="85" y1="162" x2="284" y2="125" stroke="#000" stroke-width="1"/>
  <line x1="85" y1="171" x2="285" y2="205" stroke="#000" stroke-width="1"/>
  <line x1="85" y1="177" x2="285" y2="285" stroke="#000" stroke-width="1"/>

  <!-- Lines: Admin → UCs (right side) -->
  <line x1="715" y1="162" x2="525" y2="125" stroke="#000" stroke-width="1"/>
  <line x1="715" y1="169" x2="525" y2="205" stroke="#000" stroke-width="1"/>
  <line x1="715" y1="177" x2="525" y2="285" stroke="#000" stroke-width="1"/>
  <line x1="715" y1="184" x2="525" y2="365" stroke="#000" stroke-width="1"/>
  <line x1="715" y1="190" x2="525" y2="445" stroke="#000" stroke-width="1"/>
  <line x1="715" y1="196" x2="525" y2="520" stroke="#000" stroke-width="1"/>
  <line x1="715" y1="202" x2="525" y2="590" stroke="#000" stroke-width="1"/>

  <!-- «include» relationship: Login includes Verificar Rol -->
  <ellipse cx="405" cy="155" rx="75" ry="16" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="405" y="159" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">«include» Verificar Rol</text>
  <line x1="405" y1="151" x2="405" y2="139" stroke="#000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#open)"/>

  <!-- «extends» relationship -->
  <line x1="525" y1="445" x2="575" y2="445" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
  <ellipse cx="648" cy="445" rx="68" ry="16" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="648" y="449" text-anchor="middle" font-family="Arial" font-size="9" font-style="italic">«extends» Dashboard</text>

  <!-- Legend -->
  <text x="170" y="610" font-family="Arial" font-size="9" font-style="italic">Nota: Los actores con líneas continuas tienen acceso al caso de uso. «include» y «extends» son relaciones UML estándar.</text>
</svg>
