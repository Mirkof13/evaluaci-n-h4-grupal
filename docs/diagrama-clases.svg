<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="userHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="saleHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="detailHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="productHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="transferHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1100" height="780" rx="12" fill="url(#bgGrad)" />
  <rect width="1100" height="780" rx="12" fill="none" stroke="#334155" stroke-width="2" />

  <text x="550" y="40" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" letter-spacing="1">
    DIAGRAMA DE CLASES (UML)
  </text>
  <text x="550" y="65" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    Modelo de Datos FARMABOL — Incluye Producto Multi-sucursal y Transferencias con Message Queue
  </text>

  <!-- CLASS: USUARIO -->
  <g transform="translate(50, 110)" filter="url(#dropShadow)">
    <rect width="220" height="200" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="220" height="35" rx="6" fill="url(#userHeader)"/>
    <rect y="29" width="220" height="6" fill="#1e293b" />
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Usuario</text>
    <text x="12" y="55" fill="#38bdf8" font-family="monospace" font-size="11">+ id: int {PK}</text>
    <text x="12" y="70" fill="#f1f5f9" font-family="monospace" font-size="11">+ usuario: string {UK}</text>
    <text x="12" y="85" fill="#f1f5f9" font-family="monospace" font-size="11">+ pass: string</text>
    <text x="12" y="100" fill="#f1f5f9" font-family="monospace" font-size="11">+ nombre: string</text>
    <text x="12" y="115" fill="#f1f5f9" font-family="monospace" font-size="11">+ rol: string</text>
    <text x="12" y="130" fill="#f1f5f9" font-family="monospace" font-size="11">+ sucursal: string</text>
    <line x1="0" y1="140" x2="220" y2="140" stroke="#334155" stroke-width="1.2" />
    <text x="12" y="160" fill="#f1f5f9" font-family="monospace" font-size="11">+ validar(): boolean</text>
    <text x="12" y="175" fill="#94a3b8" font-family="monospace" font-size="11">+ obtenerDatos(): JSON</text>
  </g>

  <!-- CLASS: VENTA -->
  <g transform="translate(440, 110)" filter="url(#dropShadow)">
    <rect width="220" height="200" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect width="220" height="35" rx="6" fill="url(#saleHeader)"/>
    <rect y="29" width="220" height="6" fill="#1e293b" />
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Venta</text>
    <text x="12" y="55" fill="#0284c7" font-family="monospace" font-size="11">+ id: int {PK}</text>
    <text x="12" y="70" fill="#f1f5f9" font-family="monospace" font-size="11">+ fecha: timestamp</text>
    <text x="12" y="85" fill="#f1f5f9" font-family="monospace" font-size="11">+ vendedor: string</text>
    <text x="12" y="100" fill="#f1f5f9" font-family="monospace" font-size="11">+ total: numeric</text>
    <text x="12" y="115" fill="#f1f5f9" font-family="monospace" font-size="11">+ usuario_id: int {FK}</text>
    <text x="12" y="130" fill="#f1f5f9" font-family="monospace" font-size="11">+ sucursal: string</text>
    <line x1="0" y1="140" x2="220" y2="140" stroke="#334155" stroke-width="1.2" />
    <text x="12" y="160" fill="#f1f5f9" font-family="monospace" font-size="11">+ crearVenta(): int</text>
    <text x="12" y="175" fill="#f1f5f9" font-family="monospace" font-size="11">+ calcularTotal(): double</text>
  </g>

  <!-- CLASS: DETALLE_VENTA -->
  <g transform="translate(50, 400)" filter="url(#dropShadow)">
    <rect width="220" height="220" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="220" height="35" rx="6" fill="url(#detailHeader)"/>
    <rect y="29" width="220" height="6" fill="#1e293b" />
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">DetalleVenta</text>
    <text x="12" y="55" fill="#059669" font-family="monospace" font-size="11">+ id: int {PK}</text>
    <text x="12" y="70" fill="#0ea5e9" font-family="monospace" font-size="11">+ venta_id: int {FK}</text>
    <text x="12" y="85" fill="#db2777" font-family="monospace" font-size="11">+ producto_id: int {FK}</text>
    <text x="12" y="100" fill="#f1f5f9" font-family="monospace" font-size="11">+ codigo: string</text>
    <text x="12" y="115" fill="#f1f5f9" font-family="monospace" font-size="11">+ nombre: string</text>
    <text x="12" y="130" fill="#f1f5f9" font-family="monospace" font-size="11">+ cantidad: int</text>
    <text x="12" y="145" fill="#f1f5f9" font-family="monospace" font-size="11">+ precio: numeric</text>
    <line x1="0" y1="155" x2="220" y2="155" stroke="#334155" stroke-width="1.2" />
    <text x="12" y="175" fill="#f1f5f9" font-family="monospace" font-size="11">+ calcularSubtotal(): double</text>
  </g>

  <!-- CLASS: PRODUCTO -->
  <g transform="translate(440, 400)" filter="url(#dropShadow)">
    <rect width="250" height="260" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="250" height="35" rx="6" fill="url(#productHeader)"/>
    <rect y="29" width="250" height="6" fill="#1e293b" />
    <text x="125" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Producto</text>
    <text x="12" y="55" fill="#db2777" font-family="monospace" font-size="11">+ id: int {PK}</text>
    <text x="12" y="70" fill="#fbbf24" font-family="monospace" font-size="11">+ codigo: string {UK compuesta}</text>
    <text x="12" y="85" fill="#f1f5f9" font-family="monospace" font-size="11">+ nombre: string</text>
    <text x="12" y="100" fill="#f1f5f9" font-family="monospace" font-size="11">+ precio: numeric</text>
    <text x="12" y="115" fill="#f1f5f9" font-family="monospace" font-size="11">+ stock: int</text>
    <text x="12" y="130" fill="#f1f5f9" font-family="monospace" font-size="11">+ laboratorio: string</text>
    <text x="12" y="145" fill="#f1f5f9" font-family="monospace" font-size="11">+ categoria: string</text>
    <text x="12" y="160" fill="#f1f5f9" font-family="monospace" font-size="11">+ fecha_vencimiento: date</text>
    <line x1="0" y1="170" x2="250" y2="170" stroke="#334155" stroke-width="1.2" />
    <text x="12" y="190" fill="#fbbf24" font-family="monospace" font-size="11">+ sucursal: string {UK compuesta}</text>
    <text x="12" y="205" fill="#f1f5f9" font-family="monospace" font-size="11">+ verificarStock(): boolean</text>
    <text x="12" y="220" fill="#f1f5f9" font-family="monospace" font-size="11">+ actualizarStock(): int</text>
    <text x="12" y="240" fill="#94a3b8" font-family="monospace" font-size="11">UNIQUE (codigo, sucursal)</text>
  </g>

  <!-- CLASS: TRANSFERENCIA -->
  <g transform="translate(810, 400)" filter="url(#dropShadow)">
    <rect width="240" height="260" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="240" height="35" rx="6" fill="url(#transferHeader)"/>
    <rect y="29" width="240" height="6" fill="#1e293b" />
    <text x="120" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Transferencia</text>
    <text x="12" y="55" fill="#f59e0b" font-family="monospace" font-size="11">+ id: int {PK}</text>
    <text x="12" y="70" fill="#f1f5f9" font-family="monospace" font-size="11">+ fecha: timestamp</text>
    <text x="12" y="85" fill="#f1f5f9" font-family="monospace" font-size="11">+ codigo: string</text>
    <text x="12" y="100" fill="#f1f5f9" font-family="monospace" font-size="11">+ nombre: string</text>
    <text x="12" y="115" fill="#f1f5f9" font-family="monospace" font-size="11">+ cantidad: int</text>
    <text x="12" y="130" fill="#f1f5f9" font-family="monospace" font-size="11">+ origen: string</text>
    <text x="12" y="145" fill="#f1f5f9" font-family="monospace" font-size="11">+ destino: string</text>
    <line x1="0" y1="155" x2="240" y2="155" stroke="#334155" stroke-width="1.2" />
    <text x="12" y="175" fill="#fbbf24" font-family="monospace" font-size="11">+ estado: string</text>
    <text x="12" y="190" fill="#94a3b8" font-family="monospace" font-size="11">  ['PENDIENTE', 'COMPLETADO', 'ERROR']</text>
    <text x="12" y="205" fill="#f1f5f9" font-family="monospace" font-size="11">+ mensaje: string</text>
    <text x="12" y="225" fill="#94a3b8" font-family="monospace" font-size="10">Cola de mensajes asíncrona</text>
    <text x="12" y="240" fill="#94a3b8" font-family="monospace" font-size="10">Middleware MessageQueue en server.js</text>
  </g>

  <!-- ASSOCIATIONS -->
  <!-- Usuario (1) to (0..*) Venta (registra) -->
  <g>
    <line x1="270" y1="200" x2="440" y2="200" stroke="#64748b" stroke-width="1.5" />
    <path d="M 433 196 L 440 200 L 433 204" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="310" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1</text>
    <text x="420" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">0..*</text>
    <text x="355" y="215" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">registra</text>
  </g>

  <!-- Venta (1) with DetalleVenta (1..*) (Composition) -->
  <g>
    <path d="M 550 310 L 555 318 L 550 326 L 545 318 Z" fill="#64748b" stroke="#64748b" stroke-width="1.5" />
    <line x1="550" y1="326" x2="160" y2="400" stroke="#64748b" stroke-width="1.5" />
    <path d="M 156 393 L 160 400 L 164 393" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="480" y="342" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1</text>
    <text x="280" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1..*</text>
    <text x="370" y="365" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">contiene</text>
  </g>

  <!-- Producto (1) to (0..*) DetalleVenta (se vende en) -->
  <g>
    <line x1="440" y1="530" x2="270" y2="530" stroke="#64748b" stroke-width="1.5" />
    <path d="M 277 526 L 270 530 L 277 534" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="430" y="522" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1</text>
    <text x="220" y="522" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">0..*</text>
    <text x="355" y="548" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">se vende en</text>
  </g>

  <!-- Producto (1) to (0..*) Transferencia (origen/destino) -->
  <g>
    <line x1="690" y1="580" x2="810" y2="560" stroke="#64748b" stroke-width="1.5" />
    <path d="M 803 558 L 810 560 L 804 564" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="730" y="578" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1</text>
    <text x="795" y="575" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">0..*</text>
    <text x="750" y="560" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">transfiere</text>
  </g>
</svg>