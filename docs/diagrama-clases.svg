<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <rect width="1000" height="750" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="500" y="35" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="18" font-weight="bold">DIAGRAMA DE CLASES (UML) — FARMABOL</text>
  <text x="500" y="55" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="12">Modelo de Datos con Producto Multi-sucursal y Transferencias Asíncronas</text>

  <!-- CLASS: Usuario -->
  <g transform="translate(50, 90)">
    <rect width="240" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="240" height="30" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="120" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold">Usuario</text>
    <line x1="0" y1="30" x2="240" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="48" fill="#000000" font-family="monospace" font-size="10">- id: int {PK}</text>
    <text x="10" y="63" fill="#000000" font-family="monospace" font-size="10">- usuario: string {UK}</text>
    <text x="10" y="78" fill="#000000" font-family="monospace" font-size="10">- pass: string</text>
    <text x="10" y="93" fill="#000000" font-family="monospace" font-size="10">- nombre: string</text>
    <text x="10" y="108" fill="#000000" font-family="monospace" font-size="10">- rol: string</text>
    <text x="10" y="123" fill="#000000" font-family="monospace" font-size="10">- sucursal: string</text>
    <line x1="0" y1="135" x2="240" y2="135" stroke="#000000" stroke-width="1" />
    <text x="10" y="153" fill="#000000" font-family="monospace" font-size="10">+ validarCredenciales(): bool</text>
    <text x="10" y="168" fill="#000000" font-family="monospace" font-size="10">+ obtenerSucursal(): string</text>
  </g>

  <!-- CLASS: Venta -->
  <g transform="translate(380, 90)">
    <rect width="240" height="180" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="240" height="30" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="120" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold">Venta</text>
    <line x1="0" y1="30" x2="240" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="48" fill="#000000" font-family="monospace" font-size="10">- id: int {PK}</text>
    <text x="10" y="63" fill="#000000" font-family="monospace" font-size="10">- fecha: timestamp</text>
    <text x="10" y="78" fill="#000000" font-family="monospace" font-size="10">- vendedor: string</text>
    <text x="10" y="93" fill="#000000" font-family="monospace" font-size="10">- total: numeric</text>
    <text x="10" y="108" fill="#000000" font-family="monospace" font-size="10">- sucursal: string</text>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#000000" stroke-width="1" />
    <text x="10" y="138" fill="#000000" font-family="monospace" font-size="10">+ crearVenta(): int</text>
    <text x="10" y="153" fill="#000000" font-family="monospace" font-size="10">+ calcularTotal(): numeric</text>
  </g>

  <!-- CLASS: DetalleVenta -->
  <g transform="translate(50, 370)">
    <rect width="240" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="240" height="30" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="120" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold">DetalleVenta</text>
    <line x1="0" y1="30" x2="240" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="48" fill="#000000" font-family="monospace" font-size="10">- id: int {PK}</text>
    <text x="10" y="63" fill="#000000" font-family="monospace" font-size="10">- venta_id: int {FK}</text>
    <text x="10" y="78" fill="#000000" font-family="monospace" font-size="10">- producto_id: int {FK}</text>
    <text x="10" y="93" fill="#000000" font-family="monospace" font-size="10">- codigo: string</text>
    <text x="10" y="108" fill="#000000" font-family="monospace" font-size="10">- nombre: string</text>
    <text x="10" y="123" fill="#000000" font-family="monospace" font-size="10">- cantidad: int</text>
    <text x="10" y="138" fill="#000000" font-family="monospace" font-size="10">- precio: numeric</text>
    <line x1="0" y1="150" x2="240" y2="150" stroke="#000000" stroke-width="1" />
    <text x="10" y="168" fill="#000000" font-family="monospace" font-size="10">+ calcularSubtotal(): numeric</text>
  </g>

  <!-- CLASS: Producto -->
  <g transform="translate(380, 370)">
    <rect width="280" height="240" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="280" height="30" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="140" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold">Producto</text>
    <line x1="0" y1="30" x2="280" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="48" fill="#000000" font-family="monospace" font-size="10">- id: int {PK}</text>
    <text x="10" y="63" fill="#000000" font-family="monospace" font-size="10">- codigo: string {UK}</text>
    <text x="10" y="78" fill="#000000" font-family="monospace" font-size="10">- nombre: string</text>
    <text x="10" y="93" fill="#000000" font-family="monospace" font-size="10">- precio: numeric</text>
    <text x="10" y="108" fill="#000000" font-family="monospace" font-size="10">- stock: int</text>
    <text x="10" y="123" fill="#000000" font-family="monospace" font-size="10">- laboratorio: string</text>
    <text x="10" y="138" fill="#000000" font-family="monospace" font-size="10">- categoria: string</text>
    <text x="10" y="153" fill="#000000" font-family="monospace" font-size="10">- fecha_vencimiento: date</text>
    <text x="10" y="168" fill="#000000" font-family="monospace" font-size="10">- sucursal: string {UK}</text>
    <line x1="0" y1="180" x2="280" y2="180" stroke="#000000" stroke-width="1" />
    <text x="10" y="198" fill="#000000" font-family="monospace" font-size="10">+ verificarStock(): bool</text>
    <text x="10" y="213" fill="#000000" font-family="monospace" font-size="10">+ descontarStock(cant): int</text>
    <text x="10" y="230" fill="#666666" font-family="monospace" font-size="9">UNIQUE (codigo, sucursal)</text>
  </g>

  <!-- CLASS: Transferencia -->
  <g transform="translate(720, 370)">
    <rect width="240" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="240" height="30" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="120" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold">Transferencia</text>
    <line x1="0" y1="30" x2="240" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="48" fill="#000000" font-family="monospace" font-size="10">- id: int {PK}</text>
    <text x="10" y="63" fill="#000000" font-family="monospace" font-size="10">- fecha: timestamp</text>
    <text x="10" y="78" fill="#000000" font-family="monospace" font-size="10">- codigo: string</text>
    <text x="10" y="93" fill="#000000" font-family="monospace" font-size="10">- nombre: string</text>
    <text x="10" y="108" fill="#000000" font-family="monospace" font-size="10">- cantidad: int</text>
    <text x="10" y="123" fill="#000000" font-family="monospace" font-size="10">- origen: string</text>
    <text x="10" y="138" fill="#000000" font-family="monospace" font-size="10">- destino: string</text>
    <line x1="0" y1="150" x2="240" y2="150" stroke="#000000" stroke-width="1" />
    <text x="10" y="168" fill="#000000" font-family="monospace" font-size="10">- estado: string</text>
    <text x="20" y="183" fill="#666666" font-family="monospace" font-size="9">[PENDIENTE, COMPLETADO, ERROR]</text>
    <text x="10" y="198" fill="#000000" font-family="monospace" font-size="10">- mensaje: string</text>
    <text x="10" y="218" fill="#666666" font-family="monospace" font-size="9">Cola asíncrona (MessageQueue)</text>
  </g>

  <!-- CLASS: Comprobante -->
  <g transform="translate(720, 90)">
    <rect width="240" height="180" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="240" height="30" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="120" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold">Comprobante</text>
    <line x1="0" y1="30" x2="240" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="48" fill="#000000" font-family="monospace" font-size="10">- id: int {PK}</text>
    <text x="10" y="63" fill="#000000" font-family="monospace" font-size="10">- venta_id: int {FK}</text>
    <text x="10" y="78" fill="#000000" font-family="monospace" font-size="10">- nombre_archivo: string</text>
    <text x="10" y="93" fill="#000000" font-family="monospace" font-size="10">- url: string</text>
    <text x="10" y="108" fill="#000000" font-family="monospace" font-size="10">- tipo: string</text>
    <text x="10" y="123" fill="#000000" font-family="monospace" font-size="10">- fecha: timestamp</text>
    <line x1="0" y1="135" x2="240" y2="135" stroke="#000000" stroke-width="1" />
    <text x="10" y="153" fill="#000000" font-family="monospace" font-size="10">+ obtenerURL(): string</text>
    <text x="10" y="168" fill="#000000" font-family="monospace" font-size="10">+ asociarVenta(id): bool</text>
  </g>

  <!-- ASSOCIATIONS -->
  <!-- Usuario 1 --- 0..* Venta -->
  <line x1="290" y1="180" x2="380" y2="180" stroke="#000000" stroke-width="1" />
  <polygon points="372,176 380,180 372,184" fill="none" stroke="#000000" stroke-width="1" />
  <text x="310" y="172" fill="#000000" font-family="sans-serif" font-size="10">1</text>
  <text x="365" y="172" fill="#000000" font-family="sans-serif" font-size="10">0..*</text>
  <text x="335" y="198" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="9">registra</text>

  <!-- Venta 1 --- 1..* DetalleVenta (composición) -->
  <polygon points="500,270 505,278 500,286 495,278" fill="#000000" />
  <line x1="500" y1="286" x2="170" y2="370" stroke="#000000" stroke-width="1" />
  <polygon points="162,366 170,370 162,374" fill="none" stroke="#000000" stroke-width="1" />
  <text x="430" y="302" fill="#000000" font-family="sans-serif" font-size="10">1</text>
  <text x="230" y="352" fill="#000000" font-family="sans-serif" font-size="10">1..*</text>
  <text x="350" y="335" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="9">contiene</text>

  <!-- Producto 1 --- 0..* DetalleVenta -->
  <line x1="380" y1="490" x2="290" y2="490" stroke="#000000" stroke-width="1" />
  <polygon points="298,486 290,490 298,494" fill="none" stroke="#000000" stroke-width="1" />
  <text x="370" y="482" fill="#000000" font-family="sans-serif" font-size="10">1</text>
  <text x="240" y="482" fill="#000000" font-family="sans-serif" font-size="10">0..*</text>
  <text x="335" y="508" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="9">se vende en</text>

  <!-- Producto 1 --- 0..* Transferencia -->
  <line x1="660" y1="530" x2="720" y2="510" stroke="#000000" stroke-width="1" />
  <polygon points="713,507 720,510 713,513" fill="none" stroke="#000000" stroke-width="1" />
  <text x="680" y="522" fill="#000000" font-family="sans-serif" font-size="10">1</text>
  <text x="710" y="518" fill="#000000" font-family="sans-serif" font-size="10">0..*</text>
  <text x="700" y="505" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="9">transfiere</text>

  <!-- Venta 1 --- 0..* Comprobante -->
  <line x1="620" y1="180" x2="720" y2="180" stroke="#000000" stroke-width="1" />
  <polygon points="712,176 720,180 712,184" fill="none" stroke="#000000" stroke-width="1" />
  <text x="630" y="172" fill="#000000" font-family="sans-serif" font-size="10">1</text>
  <text x="705" y="172" fill="#000000" font-family="sans-serif" font-size="10">0..*</text>
  <text x="670" y="198" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="9">tiene</text>
</svg>