<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="26" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">DIAGRAMA DE ARQUITECTURA DE SOFTWARE (UML)</text>
  <text x="410" y="44" text-anchor="middle" font-family="Arial" font-size="10">Arquitectura Monolítica por Capas — Sistema FARMABOL</text>

  <!-- LAYER 1: PRESENTATION -->
  <rect x="20" y="55" width="780" height="145" rx="4" fill="none" stroke="#000" stroke-width="2"/>
  <text x="410" y="74" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">CAPA DE PRESENTACIÓN (CLIENTE)</text>
  <text x="790" y="69" text-anchor="end" font-family="Arial" font-size="9" font-style="italic">Navegador Web / React SPA</text>

  <!-- Component: React SPA -->
  <rect x="40" y="83" width="355" height="102" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="40" y="83" width="355" height="18" rx="3" fill="#000"/>
  <text x="218" y="96" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">React SPA (Babel Standalone)</text>
  <text x="50" y="116" font-family="Arial" font-size="8.5">· farmabol-app.jsx  ·  screens  ·  farmabol-ui.jsx</text>
  <text x="50" y="130" font-family="Arial" font-size="8.5">· Componentes: Dashboard, POS, Productos</text>
  <text x="50" y="144" font-family="Arial" font-size="8.5">· Transferencias, Uploads, Historial de Ventas</text>
  <text x="50" y="158" font-family="Arial" font-size="8.5">· Estado reactivo global (store)</text>
  <text x="50" y="172" font-family="Arial" font-size="8.5">· Routing basado en roles (RBAC)</text>

  <!-- Component: Styles -->
  <rect x="415" y="83" width="365" height="102" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="415" y="83" width="365" height="18" rx="3" fill="#000"/>
  <text x="598" y="96" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">Diseño y Estilos</text>
  <text x="425" y="116" font-family="Arial" font-size="8.5">· styles.css  ·  icons.jsx  ·  shell.jsx</text>
  <text x="425" y="130" font-family="Arial" font-size="8.5">· Interfaz oscura premium, variables CSS</text>
  <text x="425" y="144" font-family="Arial" font-size="8.5">· Iconos SVG propios</text>
  <text x="425" y="158" font-family="Arial" font-size="8.5">· Layout responsivo adaptable</text>
  <text x="425" y="172" font-family="Arial" font-size="8.5">· Micro-animaciones de estado</text>

  <!-- Arrow L1 → L2 -->
  <line x1="410" y1="200" x2="410" y2="232" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="232" x2="410" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="297" y="207" width="226" height="19" rx="9" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="410" y="220" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">HTTP POST/GET (JSON REST API)</text>

  <!-- LAYER 2: BUSINESS LOGIC -->
  <rect x="20" y="240" width="780" height="150" rx="4" fill="none" stroke="#000" stroke-width="2"/>
  <text x="410" y="259" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">CAPA DE LÓGICA DE NEGOCIO Y CONTROLADORES</text>
  <text x="790" y="254" text-anchor="end" font-family="Arial" font-size="9" font-style="italic">Backend Node.js / Express</text>

  <!-- Component: Express -->
  <rect x="40" y="267" width="350" height="108" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="40" y="267" width="350" height="18" rx="3" fill="#000"/>
  <text x="215" y="280" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">Servidor Express (server.js)</text>
  <text x="50" y="301" font-family="Arial" font-size="8.5">· Endpoints REST: /api/ventas, /api/productos</text>
  <text x="50" y="315" font-family="Arial" font-size="8.5">· /api/transferencias, /api/comprobantes</text>
  <text x="50" y="329" font-family="Arial" font-size="8.5">· Autenticación RBAC (Admin / Vendedor)</text>
  <text x="50" y="343" font-family="Arial" font-size="8.5">· Transacciones ACID: BEGIN/COMMIT/ROLLBACK</text>
  <text x="50" y="357" font-family="Arial" font-size="8.5">· Bloqueo concurrente SELECT ... FOR UPDATE</text>

  <!-- Component: MessageQueue + Multer -->
  <rect x="415" y="267" width="365" height="108" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="415" y="267" width="365" height="18" rx="3" fill="#000"/>
  <text x="598" y="280" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">Middleware Message Queue + Multer</text>
  <text x="425" y="301" font-family="Arial" font-size="8.5">· Clase MessageQueue (cola FIFO en memoria)</text>
  <text x="425" y="315" font-family="Arial" font-size="8.5">· Procesa transferencias asíncronas (retardo 3s)</text>
  <text x="425" y="329" font-family="Arial" font-size="8.5">· Validación stock · SELECT ... FOR UPDATE</text>
  <text x="425" y="343" font-family="Arial" font-size="8.5">· ROLLBACK automático ante errores</text>
  <text x="425" y="357" font-family="Arial" font-size="8.5">· Multer: carga archivos multipart/form-data</text>

  <!-- Arrow L2 → L3 -->
  <line x1="410" y1="390" x2="410" y2="420" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="420" x2="410" y2="390" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="315" y="396" width="190" height="19" rx="9" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="410" y="409" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">pg.Pool Client Query</text>

  <!-- LAYER 3: PERSISTENCE -->
  <rect x="20" y="428" width="780" height="135" rx="4" fill="none" stroke="#000" stroke-width="2"/>
  <text x="410" y="447" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">CAPA DE PERSISTENCIA Y ACCESO A DATOS</text>
  <text x="790" y="442" text-anchor="end" font-family="Arial" font-size="9" font-style="italic">Base de Datos Relacional / PostgreSQL</text>

  <!-- Component: DB Adapter -->
  <rect x="40" y="455" width="350" height="93" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="40" y="455" width="350" height="18" rx="3" fill="#000"/>
  <text x="215" y="468" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">Adaptador de Base de Datos (db.js)</text>
  <text x="50" y="490" font-family="Arial" font-size="8.5">· Connection Pool &amp; Sembrado Automático</text>
  <text x="50" y="504" font-family="Arial" font-size="8.5">· Tablas: usuarios, productos, ventas</text>
  <text x="50" y="518" font-family="Arial" font-size="8.5">· detalle_ventas, transferencias, comprobantes</text>
  <text x="50" y="532" font-family="Arial" font-size="8.5">· Crea esquemas si no existen al iniciar</text>

  <!-- Component: PostgreSQL -->
  <rect x="415" y="455" width="365" height="93" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="415" y="455" width="365" height="18" rx="3" fill="#000"/>
  <text x="598" y="468" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">PostgreSQL Engine (V18)</text>
  <text x="425" y="490" font-family="Arial" font-size="8.5">· Transacciones ACID nativas</text>
  <text x="425" y="504" font-family="Arial" font-size="8.5">· Restricciones: CHECK (stock &gt;= 0), UNIQUE, FK</text>
  <text x="425" y="518" font-family="Arial" font-size="8.5">· Clave compuesta: (codigo, sucursal)</text>
  <text x="425" y="532" font-family="Arial" font-size="8.5">· Local o Supabase Cloud DB</text>
</svg>
