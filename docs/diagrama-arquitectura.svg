<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <rect width="800" height="650" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="400" y="35" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="18" font-weight="bold">DIAGRAMA DE ARQUITECTURA — FARMABOL</text>
  <text x="400" y="55" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="12">Arquitectura por Capas con Middleware Message Queue</text>

  <!-- CAPA 1: Presentación -->
  <g transform="translate(50, 90)">
    <rect width="700" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="700" height="28" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="10" y="19" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">CAPA DE PRESENTACIÓN</text>
    <text x="690" y="19" text-anchor="end" fill="#333333" font-family="sans-serif" font-size="10">Navegador Web</text>

    <g transform="translate(20, 40)">
      <rect width="300" height="55" fill="#ffffff" stroke="#000000" stroke-width="1" />
      <text x="10" y="20" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">React SPA (Babel Standalone)</text>
      <text x="10" y="38" fill="#333333" font-family="monospace" font-size="10">farmabol-app.jsx · screens · ui</text>
      <text x="10" y="50" fill="#666666" font-family="sans-serif" font-size="9">Componentes: Dashboard, POS, Transferencias, Uploads</text>
    </g>
    <g transform="translate(360, 40)">
      <rect width="300" height="55" fill="#ffffff" stroke="#000000" stroke-width="1" />
      <text x="10" y="20" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">Diseño y Estilos</text>
      <text x="10" y="38" fill="#333333" font-family="monospace" font-size="10">styles.css · icons.jsx · shell.jsx</text>
      <text x="10" y="50" fill="#666666" font-family="sans-serif" font-size="9">Interfaz oscura premium, iconos SVG, layout responsivo</text>
    </g>
  </g>

  <!-- Flecha -->
  <line x1="400" y1="200" x2="400" y2="225" stroke="#000000" stroke-width="1.5" />
  <polygon points="396,222 400,230 404,222" fill="#000000" />
  <text x="410" y="218" fill="#000000" font-family="sans-serif" font-size="10">HTTP REST JSON</text>

  <!-- CAPA 2: Backend -->
  <g transform="translate(50, 235)">
    <rect width="700" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="700" height="28" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="10" y="19" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">CAPA DE LÓGICA DE NEGOCIO (BACKEND)</text>
    <text x="690" y="19" text-anchor="end" fill="#333333" font-family="sans-serif" font-size="10">Node.js + Express</text>

    <g transform="translate(20, 40)">
      <rect width="320" height="48" fill="#ffffff" stroke="#000000" stroke-width="1" />
      <text x="10" y="18" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">Servidor Express (server.js)</text>
      <text x="10" y="35" fill="#333333" font-family="monospace" font-size="10">Endpoints REST: /api/ventas, /api/productos, /api/transferencias</text>
      <text x="10" y="45" fill="#666666" font-family="sans-serif" font-size="9">Autenticación (ADMIN/VENDEDOR) · Transacciones ACID con FOR UPDATE</text>
    </g>
    <g transform="translate(360, 40)">
      <rect width="300" height="48" fill="#ffffff" stroke="#000000" stroke-width="1" />
      <text x="10" y="18" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">Middleware Message Queue</text>
      <text x="10" y="35" fill="#333333" font-family="monospace" font-size="10">Clase MessageQueue (cola FIFO en memoria)</text>
      <text x="10" y="45" fill="#666666" font-family="sans-serif" font-size="9">Procesa transferencias asíncronas con retardo simulado de 3s</text>
    </g>

    <g transform="translate(20, 100)">
      <rect width="640" height="35" fill="#f9f9f9" stroke="#000000" stroke-width="0.5" stroke-dasharray="3 3" />
      <text x="10" y="22" fill="#000000" font-family="sans-serif" font-size="10" font-weight="bold">Validación de Stock · Bloqueo FOR UPDATE · BEGIN/COMMIT/ROLLBACK · Rollback automático en errores</text>
    </g>
  </g>

  <!-- Flecha -->
  <line x1="400" y1="385" x2="400" y2="410" stroke="#000000" stroke-width="1.5" />
  <polygon points="396,407 400,415 404,407" fill="#000000" />
  <text x="410" y="405" fill="#000000" font-family="sans-serif" font-size="10">pg.Pool Query</text>

  <!-- CAPA 3: Persistencia -->
  <g transform="translate(50, 420)">
    <rect width="700" height="200" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect width="700" height="28" fill="#eeeeee" stroke="#000000" stroke-width="0.5" />
    <text x="10" y="19" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">CAPA DE PERSISTENCIA</text>
    <text x="690" y="19" text-anchor="end" fill="#333333" font-family="sans-serif" font-size="10">PostgreSQL</text>

    <g transform="translate(20, 40)">
      <rect width="320" height="145" fill="#ffffff" stroke="#000000" stroke-width="1" />
      <text x="10" y="18" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">Adaptador BD (db.js)</text>
      <text x="10" y="35" fill="#333333" font-family="monospace" font-size="10">Connection Pool + Sembrado Automático</text>
      <text x="10" y="55" fill="#000000" font-family="monospace" font-size="10">Tablas:</text>
      <text x="10" y="72" fill="#333333" font-family="monospace" font-size="10">• usuarios (ADMIN/VENDEDOR)</text>
      <text x="10" y="89" fill="#333333" font-family="monospace" font-size="10">• productos (UNIQUE codigo+sucursal)</text>
      <text x="10" y="106" fill="#333333" font-family="monospace" font-size="10">• ventas + detalle_ventas</text>
      <text x="10" y="123" fill="#333333" font-family="monospace" font-size="10">• transferencias (cola persistida)</text>
      <text x="10" y="140" fill="#333333" font-family="monospace" font-size="10">• comprobantes (cloud storage)</text>
    </g>
    <g transform="translate(360, 40)">
      <rect width="300" height="145" fill="#ffffff" stroke="#000000" stroke-width="1" />
      <text x="10" y="18" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold">PostgreSQL Engine</text>
      <text x="10" y="35" fill="#333333" font-family="monospace" font-size="10">Transacciones ACID</text>
      <text x="10" y="52" fill="#333333" font-family="monospace" font-size="10">Restricciones: CHECK, UNIQUE, FK</text>
      <text x="10" y="69" fill="#333333" font-family="monospace" font-size="10">Clave compuesta: (codigo, sucursal)</text>
      <text x="10" y="86" fill="#333333" font-family="monospace" font-size="10">Row locking: SELECT ... FOR UPDATE</text>
      <path d="M 270 105 C 270 102, 290 102, 290 105 C 290 108, 270 108, 270 105" fill="none" stroke="#000000" stroke-width="1"/>
      <path d="M 270 105 L 270 135 C 270 138, 290 138, 290 135 L 290 105" fill="none" stroke="#000000" stroke-width="1"/>
      <path d="M 270 115 C 270 118, 290 118, 290 115" fill="none" stroke="#000000" stroke-width="0.5"/>
      <path d="M 270 125 C 270 128, 290 128, 290 125" fill="none" stroke="#000000" stroke-width="0.5"/>
    </g>
  </g>
</svg>