  <text x="350" y="60" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Herramienta: ESLint 9 · Config: Flat Config · ECMA 2024</text>

  <!-- Antes section -->
  <g transform="translate(30, 90)" filter="url(#dropShadow)">
    <rect width="300" height="170" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <rect width="300" height="30" rx="8" fill="#4c0519" />
    <text x="150" y="20" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">ANTES — Con Issues</text>
    <text x="15" y="52" fill="#fecdd3" font-family="monospace" font-size="11">C:\FARMABOL\server.js:181:24</text>
    <text x="15" y="68" fill="#f1f5f9" font-family="monospace" font-size="11">warning  'pool' is not defined  no-undef</text>
    <line x1="15" y1="80" x2="285" y2="80" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <text x="15" y="100" fill="#fecdd3" font-family="monospace" font-size="11">C:\FARMABOL\farmabol-data.jsx:1:1</text>
    <text x="15" y="116" fill="#f1f5f9" font-family="monospace" font-size="11">warning  'TODAY' is assigned but never used  no-unused-vars</text>
    <line x1="15" y1="128" x2="285" y2="128" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <text x="15" y="148" fill="#fecdd3" font-family="monospace" font-size="11">C:\FARMABOL\server.js:45:12</text>
    <text x="15" y="164" fill="#f1f5f9" font-family="monospace" font-size="11">warning  'result' is assigned but never used  no-unused-vars</text>
