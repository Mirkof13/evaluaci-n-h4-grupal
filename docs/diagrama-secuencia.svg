<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" width="100%" height="100%">
  <rect width="1000" height="950" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="500" y="35" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="18" font-weight="bold">DIAGRAMA DE SECUENCIA (UML) — TRANSFERENCIA ASÍNCRONA</text>
  <text x="500" y="55" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="12">Flujo de Transferencia de Stock entre Sucursales vía Message Queue</text>

  <!-- Lifelines -->
  <!-- Admin (Stick Figure Actor) -->
  <g transform="translate(50, 90)">
    <line x1="40" y1="57" x2="40" y2="820" stroke="#000000" stroke-width="0.5" stroke-dasharray="6 4" />
    <!-- Head -->
    <circle cx="40" cy="12" r="10" fill="none" stroke="#000000" stroke-width="1.5" />
    <!-- Body -->
    <line x1="40" y1="22" x2="40" y2="42" stroke="#000000" stroke-width="1.5" />
    <!-- Arms -->
    <line x1="26" y1="30" x2="54" y2="30" stroke="#000000" stroke-width="1.5" />
    <line x1="26" y1="32" x2="54" y2="32" stroke="#000000" stroke-width="1.5" />
    <!-- Legs -->
    <line x1="40" y1="42" x2="28" y2="52" stroke="#000000" stroke-width="1.5" />
    <line x1="40" y1="42" x2="52" y2="52" stroke="#000000" stroke-width="1.5" />
    <!-- Label -->
    <text x="40" y="72" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">:Admin</text>
  </g>

  <!-- Frontend -->
  <g transform="translate(220, 90)">
    <line x1="60" y1="35" x2="60" y2="820" stroke="#000000" stroke-width="0.5" stroke-dasharray="6 4" />
    <rect width="120" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="60" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">:Frontend React</text>
  </g>

  <!-- Express -->
  <g transform="translate(410, 90)">
    <line x1="60" y1="35" x2="60" y2="820" stroke="#000000" stroke-width="0.5" stroke-dasharray="6 4" />
    <rect width="120" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="60" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">:server.js</text>
  </g>

  <!-- MessageQueue -->
  <g transform="translate(590, 90)">
    <line x1="60" y1="35" x2="60" y2="820" stroke="#000000" stroke-width="0.5" stroke-dasharray="6 4" />
    <rect width="120" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="60" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">:MessageQueue</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(830, 90)">
    <line x1="55" y1="35" x2="55" y2="820" stroke="#000000" stroke-width="0.5" stroke-dasharray="6 4" />
    <rect width="110" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="55" y="20" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">:PostgreSQL</text>
  </g>

  <!-- Activation bars -->
  <rect x="88" y="135" width="4" height="650" fill="#000000" opacity="0.1" />
  <rect x="275" y="135" width="10" height="650" fill="#000000" opacity="0.15" />
  <rect x="465" y="155" width="10" height="630" fill="#000000" opacity="0.15" />
  <rect x="645" y="330" width="10" height="420" fill="#000000" opacity="0.1" />
  <rect x="880" y="210" width="10" height="25" fill="#000000" opacity="0.2" />
  <rect x="880" y="400" width="10" height="25" fill="#000000" opacity="0.2" />
  <rect x="880" y="480" width="10" height="190" fill="#000000" opacity="0.2" />
  <rect x="880" y="710" width="10" height="25" fill="#000000" opacity="0.2" />

  <!-- 1. Submit form -->
  <line x1="92" y1="140" x2="275" y2="140" stroke="#000000" stroke-width="1" />
  <polygon points="272,137 280,140 272,143" fill="#000000" />
  <text x="183" y="132" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">1. Llenar y enviar formulario</text>

  <!-- 2. POST /api/transferencias -->
  <line x1="285" y1="165" x2="465" y2="165" stroke="#000000" stroke-width="1" />
  <polygon points="462,162 470,165 462,168" fill="#000000" />
  <text x="375" y="158" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10" font-weight="bold">2. POST /api/transferencias</text>

  <!-- 3. INSERT PENDIENTE -->
  <line x1="475" y1="190" x2="880" y2="190" stroke="#000000" stroke-width="1" />
  <polygon points="877,187 885,190 877,193" fill="#000000" />
  <text x="677" y="183" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">3. INSERT transferencias (estado='PENDIENTE')</text>

  <!-- Response -->
  <line x1="880" y1="220" x2="475" y2="220" stroke="#000000" stroke-width="0.5" stroke-dasharray="4 4" />
  <polygon points="478,217 470,220 478,223" fill="#000000" />
  <text x="677" y="215" text-anchor="middle" fill="#333333" font-family="sans-serif" font-size="9">transferId</text>

  <!-- 4. Queue push -->
  <line x1="475" y1="250" x2="645" y2="250" stroke="#000000" stroke-width="1" />
  <polygon points="642,247 650,250 642,253" fill="#000000" />
  <text x="560" y="243" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">4. transferQueue.push(job)</text>

  <!-- 5. 202 Accepted -->
  <line x1="465" y1="290" x2="285" y2="290" stroke="#000000" stroke-width="0.5" stroke-dasharray="4 4" />
  <polygon points="288,287 280,290 288,293" fill="#000000" />
  <text x="375" y="283" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10" font-weight="bold">5. 202 Accepted { id, estado }</text>

  <!-- 6. Mostrar mensaje -->
  <line x1="275" y1="310" x2="92" y2="310" stroke="#000000" stroke-width="0.5" stroke-dasharray="4 4" />
  <polygon points="95,307 87,310 95,313" fill="#000000" />
  <text x="183" y="303" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">6. Mostrar "Transferencia #N encolada"</text>

  <!-- Background processing box -->
  <rect x="160" y="340" width="690" height="420" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="5 5" />
  <rect x="160" y="340" width="130" height="20" fill="#ffffff" stroke="#000000" stroke-width="0.5" />
  <text x="170" y="354" fill="#000000" font-family="sans-serif" font-size="9" font-weight="bold">Procesamiento en 2do plano (3s)</text>

  <!-- 7. pool.connect -->
  <line x1="655" y1="380" x2="880" y2="380" stroke="#000000" stroke-width="1" />
  <polygon points="877,377 885,380 877,383" fill="#000000" />
  <text x="767" y="373" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">7. pool.connect()</text>

  <!-- 8. BEGIN -->
  <line x1="655" y1="410" x2="880" y2="410" stroke="#000000" stroke-width="1" />
  <polygon points="877,407 885,410 877,413" fill="#000000" />
  <text x="767" y="403" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10" font-weight="bold">8. BEGIN</text>

  <!-- 9. SELECT FOR UPDATE -->
  <line x1="655" y1="440" x2="880" y2="440" stroke="#000000" stroke-width="1" />
  <polygon points="877,437 885,440 877,443" fill="#000000" />
  <text x="767" y="433" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">9. SELECT ... FOR UPDATE (origen)</text>

  <!-- 10. UPDATE origen -->
  <line x1="655" y1="490" x2="880" y2="490" stroke="#000000" stroke-width="1" />
  <polygon points="877,487 885,490 877,493" fill="#000000" />
  <text x="767" y="483" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">10. UPDATE stock = stock - cantidad (origen)</text>

  <!-- 11. INSERT/UPDATE destino -->
  <line x1="655" y1="530" x2="880" y2="530" stroke="#000000" stroke-width="1" />
  <polygon points="877,527 885,530 877,533" fill="#000000" />
  <text x="767" y="523" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">11. INSERT/UPDATE productos (destino)</text>

  <!-- 12. UPDATE estado COMPLETADO -->
  <line x1="655" y1="570" x2="880" y2="570" stroke="#000000" stroke-width="1" />
  <polygon points="877,567 885,570 877,573" fill="#000000" />
  <text x="767" y="563" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">12. UPDATE transferencias SET estado='COMPLETADO'</text>

  <!-- 13. COMMIT -->
  <line x1="655" y1="610" x2="880" y2="610" stroke="#000000" stroke-width="1" />
  <polygon points="877,607 885,610 877,613" fill="#000000" />
  <text x="767" y="603" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10" font-weight="bold">13. COMMIT</text>

  <!-- 14. client.release -->
  <line x1="655" y1="650" x2="880" y2="650" stroke="#000000" stroke-width="1" />
  <polygon points="877,647 885,650 877,653" fill="#000000" />
  <text x="767" y="643" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">14. client.release()</text>

  <!-- Alt error box -->
  <rect x="200" y="680" width="600" height="50" fill="none" stroke="#000000" stroke-width="0.5" stroke-dasharray="3 3" />
  <rect x="200" y="680" width="60" height="18" fill="#ffffff" stroke="#000000" stroke-width="0.5" />
  <text x="205" y="693" fill="#000000" font-family="sans-serif" font-size="9" font-weight="bold">alt [error]</text>
  <text x="210" y="720" fill="#000000" font-family="sans-serif" font-size="10">Si hay error: ROLLBACK + UPDATE estado='ERROR' con mensaje</text>

  <!-- 15. Polling -->
  <line x1="285" y1="780" x2="465" y2="780" stroke="#000000" stroke-width="0.5" stroke-dasharray="4 4" />
  <polygon points="462,777 470,780 462,783" fill="#000000" />
  <text x="375" y="773" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">15. Polling GET /api/state (c/2s mientras haya PENDIENTES)</text>

  <!-- 16. UI update -->
  <line x1="465" y1="800" x2="285" y2="800" stroke="#000000" stroke-width="0.5" stroke-dasharray="4 4" />
  <polygon points="288,797 280,800 288,803" fill="#000000" />
  <text x="375" y="793" text-anchor="middle" fill="#000000" font-family="sans-serif" font-size="10">16. Actualizar UI con nuevo estado</text>
</svg>