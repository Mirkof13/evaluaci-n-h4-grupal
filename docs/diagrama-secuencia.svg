<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="860" height="700">
  <defs>
    <marker id="msg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="ret" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="24" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">DIAGRAMA DE SECUENCIA UML — REGISTRO DE VENTA</text>
  <text x="430" y="42" text-anchor="middle" font-family="Arial" font-size="10">Flujo de Transacción ACID con Bloqueo Concurrente (FOR UPDATE) en FARMABOL</text>

  <!-- PARTICIPANTS -->
  <!-- :Vendedor -->
  <rect x="20" y="54" width="95" height="36" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="68" y="68" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">:Vendedor</text>
  <text x="68" y="82" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">(Usuario)</text>

  <!-- :Frontend (React) -->
  <rect x="165" y="54" width="110" height="36" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="220" y="68" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">:Frontend</text>
  <text x="220" y="82" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">(React SPA)</text>

  <!-- :server.js -->
  <rect x="360" y="54" width="105" height="36" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="413" y="68" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">:server.js</text>
  <text x="413" y="82" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">(Express)</text>

  <!-- :db.js/Pool -->
  <rect x="540" y="54" width="110" height="36" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="595" y="68" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">:db.js / Pool</text>
  <text x="595" y="82" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">(pg.Pool)</text>

  <!-- :PostgreSQL Engine -->
  <rect x="725" y="54" width="115" height="36" rx="3" fill="#000"/>
  <text x="783" y="68" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">:PostgreSQL</text>
  <text x="783" y="82" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff" font-style="italic">Engine</text>

  <!-- LIFELINES (dashed vertical lines) -->
  <line x1="68" y1="90" x2="68" y2="690" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="220" y1="90" x2="220" y2="690" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="413" y1="90" x2="413" y2="690" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="595" y1="90" x2="595" y2="690" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="783" y1="90" x2="783" y2="690" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ACTIVATION BOXES -->
  <rect x="212" y="122" width="16" height="520" fill="#ddd" stroke="#000" stroke-width="1"/>
  <rect x="405" y="145" width="16" height="480" fill="#ddd" stroke="#000" stroke-width="1"/>
  <rect x="587" y="165" width="16" height="400" fill="#ddd" stroke="#000" stroke-width="1"/>
  <rect x="775" y="185" width="16" height="360" fill="#ddd" stroke="#000" stroke-width="1"/>

  <!-- MESSAGE 1: Vendedor → Frontend: Click "Registrar Venta" -->
  <line x1="68" y1="120" x2="212" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="140" y="114" text-anchor="middle" font-family="Arial" font-size="9">1. Click "Registrar Venta"</text>

  <!-- MESSAGE 2: Frontend → server.js: POST /api/ventas -->
  <line x1="228" y1="145" x2="405" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="316" y="139" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">2. POST /api/ventas (items, vendedor)</text>

  <!-- MESSAGE 3: server.js → Pool: pool.connect() -->
  <line x1="421" y1="165" x2="587" y2="165" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="504" y="159" text-anchor="middle" font-family="Arial" font-size="9">3. pool.connect()</text>
  <text x="504" y="171" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">→ client instance</text>

  <!-- MESSAGE 4: Pool → PostgreSQL: BEGIN -->
  <line x1="603" y1="185" x2="775" y2="185" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="689" y="179" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">4. client.query('BEGIN')</text>
  <!-- Return OK -->
  <line x1="775" y1="197" x2="603" y2="197" stroke="#000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ret)"/>
  <text x="689" y="208" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">OK (Transaction Started)</text>

  <!-- LOOP FRAME -->
  <rect x="280" y="220" width="560" height="140" rx="3" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="280" y="220" width="80" height="18" fill="#000"/>
  <text x="285" y="233" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">loop</text>
  <text x="400" y="233" font-family="Arial" font-size="9" font-style="italic">[para cada ítem del carrito]</text>

  <!-- MESSAGE 5 (inside loop): SELECT FOR UPDATE -->
  <line x1="421" y1="250" x2="775" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="598" y="244" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">5. SELECT ... WHERE codigo=$1 FOR UPDATE</text>
  <!-- Return: product row (stock locked) -->
  <line x1="775" y1="263" x2="421" y2="263" stroke="#000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ret)"/>
  <text x="598" y="274" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">product row (stock locked)</text>

  <!-- ALT FRAME inside loop: stock insufficient → ROLLBACK -->
  <rect x="290" y="285" width="540" height="64" rx="2" fill="none" stroke="#000" stroke-width="1"/>
  <rect x="290" y="285" width="36" height="16" fill="#000"/>
  <text x="293" y="297" font-family="Arial" font-size="8" font-weight="bold" fill="#fff">alt</text>
  <text x="340" y="297" font-family="Arial" font-size="8" font-style="italic">[stock &lt; cant] → ROLLBACK</text>
  <text x="300" y="318" font-family="Arial" font-size="9">6. Validar Stock y Precio</text>
  <text x="300" y="335" font-family="Arial" font-size="9" fill="#c00">Si stock &lt; cantidad: ROLLBACK automático → HTTP 400</text>

  <!-- MESSAGE 7: INSERT ventas -->
  <line x1="421" y1="375" x2="775" y2="375" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="598" y="369" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">7. INSERT INTO ventas (vendedor, total) RETURNING id</text>
  <line x1="775" y1="387" x2="421" y2="387" stroke="#000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ret)"/>
  <text x="598" y="398" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">ventaId</text>

  <!-- LOOP FRAME 2: update stock + insert detail -->
  <rect x="280" y="410" width="560" height="105" rx="3" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="280" y="410" width="80" height="18" fill="#000"/>
  <text x="285" y="423" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">loop</text>
  <text x="400" y="423" font-family="Arial" font-size="9" font-style="italic">[para cada ítem procesado]</text>

  <!-- MESSAGE 8: UPDATE stock -->
  <line x1="421" y1="438" x2="775" y2="438" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="598" y="432" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">8. UPDATE productos SET stock = stock - $1 WHERE id=$2</text>
  <line x1="775" y1="450" x2="421" y2="450" stroke="#000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ret)"/>
  <text x="598" y="460" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">OK</text>

  <!-- MESSAGE 9: INSERT detalle_ventas -->
  <line x1="421" y1="475" x2="775" y2="475" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="598" y="469" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">9. INSERT INTO detalle_ventas (venta_id, prod_id, ...)</text>
  <line x1="775" y1="487" x2="421" y2="487" stroke="#000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ret)"/>
  <text x="598" y="497" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">OK</text>

  <!-- MESSAGE 10: COMMIT -->
  <line x1="421" y1="530" x2="775" y2="530" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="598" y="524" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">10. client.query('COMMIT')</text>
  <line x1="775" y1="542" x2="421" y2="542" stroke="#000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ret)"/>
  <text x="598" y="552" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">OK (Committed)</text>

  <!-- MESSAGE 11: client.release() -->
  <line x1="421" y1="565" x2="587" y2="565" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="504" y="559" text-anchor="middle" font-family="Arial" font-size="9">11. client.release()</text>
  <line x1="587" y1="577" x2="421" y2="577" stroke="#000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ret)"/>
  <text x="504" y="588" text-anchor="middle" font-family="Arial" font-size="8" font-style="italic">released</text>

  <!-- MESSAGE 12: Response 201 Created -->
  <line x1="421" y1="605" x2="228" y2="605" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="316" y="599" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">12. Response 201 Created { id, total }</text>

  <!-- MESSAGE 13: Mostrar "Venta Exitosa" -->
  <line x1="212" y1="630" x2="68" y2="630" stroke="#000" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="140" y="624" text-anchor="middle" font-family="Arial" font-size="9">13. Mostrar "Venta Exitosa" &amp; Limpiar Carrito</text>
</svg>
